name: Wren

options:
  bundleIdPrefix: au.wren
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  WrenCore:
    path: Packages/WrenCore

targets:
  Wren:
    type: application
    platform: iOS
    sources:
      - path: Wren
        excludes:
          - Info.plist
      - path: Models
    dependencies:
      - package: WrenCore
    settings:
      base:
        # Info.plist is hand-written and committed, so it is referenced rather
        # than generated — an `info:` block would have XcodeGen overwrite it.
        INFOPLIST_FILE: Wren/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.9.2"
        CURRENT_PROJECT_VERSION: "15"
        PRODUCT_BUNDLE_IDENTIFIER: au.wren.app
        PRODUCT_NAME: Wren
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Overridden by CI with the real commit; identifies local builds otherwise.
        WREN_GIT_SHA: local
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
